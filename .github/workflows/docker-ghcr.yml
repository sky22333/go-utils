name: ghcr镜像构建

on:
  workflow_dispatch:
    inputs:
      build_context:
        description: 'Build path (构建上下文路径，例如: ./src)'
        required: true
        default: '.'
      version:
        description: 'Version number (版本号)'
        required: true
        default: 'latest'

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Generate image tag
        id: meta
        shell: bash
        run: |
          BUILD_CONTEXT="${{ inputs.build_context }}"
          VERSION="${{ inputs.version }}"

          if [ "$BUILD_CONTEXT" = "." ]; then
            TAG_PREFIX=""
          else
            TAG_PREFIX=$(echo "$BUILD_CONTEXT" \
              | sed 's|^\.\/||' \
              | sed 's|\/|-|g')
            TAG_PREFIX="${TAG_PREFIX}-"
          fi

          if [ "$VERSION" = "latest" ]; then
            FINAL_TAG="${TAG_PREFIX}latest"
          else
            FINAL_TAG="${TAG_PREFIX}${VERSION}"
          fi

          echo "build_context=$BUILD_CONTEXT" >> "$GITHUB_OUTPUT"
          echo "tag=$FINAL_TAG" >> "$GITHUB_OUTPUT"

          echo "构建上下文: $BUILD_CONTEXT"
          echo "镜像标签: $FINAL_TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: ${{ steps.meta.outputs.build_context }}
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:${{ steps.meta.outputs.tag }}
          build-args: |
            VERSION=${{ steps.meta.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
