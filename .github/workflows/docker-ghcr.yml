# github镜像自动构建和推送示例，手动触发
name: ghcr镜像构建
on:
  workflow_dispatch:
    inputs:
      build_context:
        description: 'Build context path (构建上下文路径，例如: . 或 ./src 或 ./app/backend)'
        required: true
        default: '.'
      version:
        description: 'Version number (版本号)'
        required: true
        default: 'latest'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set build context and generate tag
        run: |
          BUILD_CONTEXT="${{ github.event.inputs.build_context }}"
          VERSION="${{ github.event.inputs.version }}"
          
          # 处理构建上下文路径，生成tag前缀
          if [ "$BUILD_CONTEXT" = "." ]; then
            # 根目录，不添加前缀
            TAG_PREFIX=""
          else
            # 去掉开头的 ./ 并将路径分隔符替换为连字符
            TAG_PREFIX=$(echo "$BUILD_CONTEXT" | sed 's|^\.\/||' | sed 's|\/|-|g')
            TAG_PREFIX="${TAG_PREFIX}-"
          fi
          
          # 生成最终的tag
          if [ "$VERSION" = "latest" ]; then
            FINAL_TAG="${TAG_PREFIX}latest"
          else
            FINAL_TAG="${TAG_PREFIX}${VERSION}"
          fi
          
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> $GITHUB_ENV
          echo "FINAL_TAG=$FINAL_TAG" >> $GITHUB_ENV
          echo "构建上下文: $BUILD_CONTEXT"
          echo "生成的标签: $FINAL_TAG"
            
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        run: |
          docker buildx build --push \
            --platform linux/amd64 \
            --tag ghcr.io/${{ github.repository }}:${{ env.FINAL_TAG }} \
            --build-arg VERSION=${{ env.FINAL_TAG }} \
            ${{ env.BUILD_CONTEXT }}
        env:
          GHCR_PUBLIC: true
