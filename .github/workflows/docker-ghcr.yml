# github镜像自动构建和推送示例，手动触发
name: ghcr镜像构建
on:
  workflow_dispatch:
    inputs:
      build_context:
        description: 'Build context path (构建上下文路径)'
        required: true
        default: '.'
        type: choice
        options:
          - '.'
          - './node'
          - './python'
          - './java'
          - './go'
      version:
        description: 'Version number (版本号)'
        required: true
        default: 'latest'
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      - name: Set build context and version
        run: |
          BUILD_CONTEXT="${{ github.event.inputs.build_context }}"
          VERSION="${{ github.event.inputs.version }}"
          
          # 根据构建上下文自动设置默认版本
          if [ "$VERSION" = "latest" ] && [ "$BUILD_CONTEXT" != "." ]; then
            # 从路径中提取目录名作为版本前缀
            CONTEXT_NAME=$(basename "$BUILD_CONTEXT")
            VERSION="${CONTEXT_NAME}-latest"
          fi
          
          echo "BUILD_CONTEXT=$BUILD_CONTEXT" >> $GITHUB_ENV
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "构建上下文: $BUILD_CONTEXT"
          echo "构建版本: $VERSION"
            
      - name: Log in to GitHub Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
          
      - name: Build and push Docker image
        run: |
          docker buildx build --push \
            --platform linux/amd64,linux/arm64 \
            --tag ghcr.io/${{ github.repository }}:${{ env.VERSION }} \
            --build-arg VERSION=${{ env.VERSION }} \
            ${{ env.BUILD_CONTEXT }}
        env:
          GHCR_PUBLIC: true
