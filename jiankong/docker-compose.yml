services:
  jiankong:
    build: .
    container_name: jiankong
    restart: always
    environment:
      BOT_TOKEN: "your_bot_token_here"  # 你的 Telegram 机器人 Token，用于连接 Telegram API
      CHAT_ID: "1001234567890"  # Telegram 聊天 ID，用于发送消息的目标聊天（群组或个人）
      ADMIN_ID: "1001234567890"  # 管理员 ID，用于权限控制（默认与 CHAT_ID 相同）
      TZ: "Asia/Shanghai"
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    privileged: true
    pid: host
    network_mode: host
